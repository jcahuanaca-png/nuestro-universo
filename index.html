<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nuestro Universo</title>

<style>
body {
margin:0;
overflow:hidden;
background:black;
font-family:Arial;
}

canvas { display:block; }

#modal {
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:rgba(0,0,0,0.9);
padding:20px;
border-radius:15px;
display:none;
color:white;
text-align:center;
width:300px;
z-index:10;
}

#modal img {
width:100%;
border-radius:10px;
margin-bottom:10px;
}

button {
padding:8px 15px;
background:#4444ff;
border:none;
color:white;
border-radius:8px;
cursor:pointer;
}
</style>
</head>

<body>

<div id="modal">
<h2 id="modalTitle"></h2>
<img id="modalImg">
<p id="modalText"></p>
<button onclick="closeModal()">Cerrar</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

<script>

let scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 2000);
camera.position.z = 30;

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

let controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.3;

let raycaster = new THREE.Raycaster();
let mouse = new THREE.Vector2();
let textureLoader = new THREE.TextureLoader();
let planets = [];


// ⭐ CREAR ESTRELLAS BRILLANTES
let starGeometry = new THREE.BufferGeometry();
let starCount = 2000;
let positions = [];

for(let i=0; i<starCount; i++){
positions.push(
(Math.random()-0.5)*2000,
(Math.random()-0.5)*2000,
(Math.random()-0.5)*2000
);
}

starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));

let starMaterial = new THREE.PointsMaterial({
color:0xffffff,
size:2,
transparent:true
});

let stars = new THREE.Points(starGeometry, starMaterial);
scene.add(stars);


// 🪐 TEXTOS
let titles = [
"Nuestra Historia",
"Primer Recuerdo",
"Un Viaje",
"Una Sonrisa",
"Un Momento",
"Un Abrazo",
"Un Sueño",
"Nuestro Universo"
];

let texts = [
"Todo comenzó aquí.",
"El inicio de algo especial.",
"Donde el tiempo se detuvo.",
"Esa sonrisa inolvidable.",
"Un instante eterno.",
"El abrazo que lo cambió todo.",
"Soñando juntos.",
"Siempre tú y yo."
];


// 🪐 CREAR PLANETAS
for(let i=0;i<8;i++){

let geometry = new THREE.SphereGeometry(3,32,32);
let material = new THREE.MeshBasicMaterial({
map: textureLoader.load(`p${i+1}.jpeg`)
});

let planet = new THREE.Mesh(geometry, material);

planet.position.x = Math.cos(i * Math.PI/4) * 15;
planet.position.y = Math.sin(i * Math.PI/4) * 10;

planet.userData = {
title: titles[i],
text: texts[i],
img: `p${i+1}.jpeg`
};

scene.add(planet);
planets.push(planet);
}


// 🖱 CLICK
window.addEventListener('click', function(event){

mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
mouse.y = - (event.clientY / window.innerHeight) * 2 + 1;

raycaster.setFromCamera(mouse, camera);
let intersects = raycaster.intersectObjects(planets);

if(intersects.length > 0){
let obj = intersects[0].object;
document.getElementById("modalTitle").innerText = obj.userData.title;
document.getElementById("modalText").innerText = obj.userData.text;
document.getElementById("modalImg").src = obj.userData.img;
document.getElementById("modal").style.display = "block";
}

});

function closeModal(){
document.getElementById("modal").style.display = "none";
}


// 🔄 ANIMACIÓN
function animate(){
requestAnimationFrame(animate);
stars.rotation.y += 0.0005;
controls.update();
renderer.render(scene,camera);
}

animate();

</script>

</body>
</html>
