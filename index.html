<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nuestro Universo</title>

<style>
body{
margin:0;
overflow:hidden;
background:black;
font-family:Arial;
}

canvas{display:block;}

#modal{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:rgba(0,0,0,0.95);
padding:25px;
border-radius:20px;
display:none;
color:white;
text-align:center;
width:450px;
max-height:80vh;
overflow:auto;
z-index:10;
box-shadow:0 0 30px rgba(255,255,255,0.3);
}

#modal img{
width:100%;
border-radius:15px;
margin-bottom:15px;
}

button{
padding:10px 18px;
background:#3366ff;
border:none;
color:white;
border-radius:8px;
cursor:pointer;
margin-top:15px;
}
</style>
</head>

<body>

<div id="modal">
<img id="modalImg">
<p id="modalText"></p>
<button onclick="closeModal()">Cerrar</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

<script>

let scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 5000);
camera.position.set(0, 25, 150);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

let controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

let raycaster = new THREE.Raycaster();
let mouse = new THREE.Vector2();
let textureLoader = new THREE.TextureLoader();
let planets = [];
let asteroids = [];


/* ⭐ MUCHÍSIMAS ESTRELLAS */
let starGeometry = new THREE.BufferGeometry();
let starCount = 12000;
let starPositions = [];

for(let i=0;i<starCount;i++){
starPositions.push(
(Math.random()-0.5)*6000,
(Math.random()-0.5)*2500,
(Math.random()-0.5)*6000
);
}

starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starPositions,3));

let starMaterial = new THREE.PointsMaterial({
color:0xffffff,
size:1.5
});

let stars = new THREE.Points(starGeometry, starMaterial);
scene.add(stars);


/* ☄️ METEORITOS */
let asteroidGeometry = new THREE.SphereGeometry(1,8,8);
let asteroidMaterial = new THREE.MeshStandardMaterial({color:0x888888});

for(let i=0;i<400;i++){
let rock = new THREE.Mesh(asteroidGeometry, asteroidMaterial);
rock.position.set(
(Math.random()-0.5)*500,
(Math.random()-0.5)*120,
(Math.random()-0.5)*500
);
scene.add(rock);
asteroids.push(rock);
}


/* 💡 LUZ */
let light = new THREE.PointLight(0xffffff,2);
light.position.set(-200,100,100);
scene.add(light);


/* 💙 MENSAJES BONITOS */
let messages = [
"Todo comenzó como algo pequeño, casi imperceptible… pero con el tiempo se transformó en algo inmenso, profundo y lleno de significado.",
"Hay recuerdos que no necesitan explicación, porque se sienten en el corazón y permanecen ahí, brillando en silencio.",
"En algún rincón del universo existe un momento donde todo se alineó perfectamente, y ese instante sigue viviendo dentro de mí.",
"No importa la distancia ni el tiempo, hay conexiones que simplemente no se rompen, porque están hechas de algo más fuerte que el espacio.",
"A veces lo más grande no se ve, pero se siente… y lo que siento es tan vasto como el infinito.",
"Cada risa compartida, cada mirada, cada palabra, fue construyendo algo que ni las estrellas podrían medir.",
"Existen momentos que parecen simples, pero se convierten en eternos sin que nos demos cuenta.",
"Y si el universo es infinito, entonces lo que guardo aquí dentro también lo es."
];


/* 🪐 CREAR PLANETAS CON p1.jpg */
for(let i=0;i<8;i++){

let geometry = new THREE.SphereGeometry(8,32,32);
let material = new THREE.MeshStandardMaterial({
map: textureLoader.load(`./p${i+1}.jpg`)
});

let planet = new THREE.Mesh(geometry, material);

planet.position.x = i * 35 - 120;
planet.position.y = 0;

planet.userData = {
text: messages[i],
img: `./p${i+1}.jpg`
};

scene.add(planet);
planets.push(planet);
}


/* 🖱 CLICK */
window.addEventListener('click', function(event){

mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
mouse.y = - (event.clientY / window.innerHeight) * 2 + 1;

raycaster.setFromCamera(mouse, camera);
let intersects = raycaster.intersectObjects(planets);

if(intersects.length > 0){

let obj = intersects[0].object;

document.getElementById("modalText").innerText = obj.userData.text;
document.getElementById("modalImg").src = obj.userData.img;
document.getElementById("modal").style.display = "block";
}
});

function closeModal(){
document.getElementById("modal").style.display = "none";
}


/* 🔄 ANIMACIÓN */
function animate(){
requestAnimationFrame(animate);

/* Rotación estrellas */
stars.rotation.y += 0.0005;

/* Rotación planetas */
planets.forEach(p=>{
p.rotation.y += 0.01;
});

/* Movimiento meteoritos */
asteroids.forEach(a=>{
a.rotation.x += 0.02;
a.rotation.y += 0.01;
});

controls.update();
renderer.render(scene,camera);
}

animate();

</script>

</body>
</html>
