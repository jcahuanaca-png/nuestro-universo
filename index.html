<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nuestro Universo</title>
<style>
body { margin: 0; overflow: hidden; background: radial-gradient(circle at center, #1a1f4f, #0d0f2b 70%); font-family: Arial, sans-serif;}
canvas { display: block; }

#intro {
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
background: rgba(10,10,30,0.9);
padding: 30px;
border-radius: 15px;
text-align: center;
color: white;
box-shadow: 0 0 30px rgba(120, 90, 255, 0.7);
}
#intro button {
margin-top: 15px;
padding: 10px 20px;
border: none;
background: #5f6fff;
color: white;
border-radius: 8px;
cursor: pointer;
}

#modal {
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
background: rgba(20,20,50,0.95);
padding: 20px;
border-radius: 15px;
display: none;
color: white;
text-align: center;
width: 300px;
}
#modal img {
width: 100%;
border-radius: 10px;
margin-bottom: 10px;
}
#closeBtn {
margin-top: 10px;
padding: 8px 15px;
background: #7b5fff;
border: none;
color: white;
border-radius: 8px;
cursor: pointer;
}
</style>
</head>
<body>

<div id="intro">
<h1>Nuestro Universo Azul 💙🌌</h1>
<p>Explora cada planeta… cada uno guarda un recuerdo, un momento y un pedacito de mi corazón.</p>
<button onclick="startExperience()">Entrar al universo</button>
</div>

<div id="modal">
<h2 id="modalTitle"></h2>
<img id="modalImg" src="">
<p id="modalText"></p>
<button id="closeBtn">Cerrar</button>
</div>

<!-- Música -->
<iframe id="music" width="0" height="0"
src="https://www.youtube.com/embed/RDUETbWG2bv-s&start_radio=1?autoplay=1&loop=1&playlist=RDUETbWG2bv-s&start_radio=1"
frameborder="0"
allow="autoplay">
</iframe>


<script>
let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

camera.position.z = 20;

let controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;

let textureLoader = new THREE.TextureLoader();
let raycaster = new THREE.Raycaster();
let mouse = new THREE.Vector2();
let planets = [];

let titles = [
"Nuestro Pequeño Mundo",
"Dulce Como Tú",
"Entre Cielos y Promesas",
"Luz en Movimiento",
"Donde el Tiempo se Detuvo",
"Mi Estrella Azul",
"Un Beso Eterno",
"La Sonrisa que Ilumina mi Universo"
];

let texts = [
"Desde lo más simple hasta lo más grande, contigo todo se siente hogar.",
"Ese día entendí que tu dulzura no se compara con nada en este universo.",
"El cielo fue testigo de mis promesas silenciosas contigo.",
"Incluso en movimiento, tú eres mi calma.",
"El mundo se detuvo cuando entendí que eras tú.",
"Brillas diferente… y siempre iluminas mi oscuridad.",
"Un momento, un beso, un recuerdo eterno.",
"Tu sonrisa es la razón por la que mi universo tiene luz."
];

for(let i=0;i<8;i++){
let geometry = new THREE.SphereGeometry(2,32,32);
let material = new THREE.MeshBasicMaterial({map: textureLoader.load(`p${i+1}.jpg`)});
let planet = new THREE.Mesh(geometry, material);
planet.position.x = Math.cos(i)*10;
planet.position.y = Math.sin(i)*5;
planet.userData = {title: titles[i], text: texts[i], img:`p${i+1}.jpg`};
scene.add(planet);
planets.push(planet);
}

// Corazones estrellas
for(let i=0;i<200;i++){
let starGeo = new THREE.SphereGeometry(0.1,8,8);
let starMat = new THREE.MeshBasicMaterial({color:0xffffff});
let star = new THREE.Mesh(starGeo, starMat);
star.position.set(
(Math.random()-0.5)*100,
(Math.random()-0.5)*100,
(Math.random()-0.5)*100
);
scene.add(star);
}

window.addEventListener('click', function(event){
mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
mouse.y = - (event.clientY / window.innerHeight) * 2 + 1;
raycaster.setFromCamera(mouse, camera);
let intersects = raycaster.intersectObjects(planets);
if(intersects.length > 0){
let obj = intersects[0].object;
document.getElementById("modalTitle").innerText = obj.userData.title;
document.getElementById("modalText").innerText = obj.userData.text;
document.getElementById("modalImg").src = obj.userData.img;
document.getElementById("modal").style.display = "block";
}
});

document.getElementById("closeBtn").onclick = function(){
document.getElementById("modal").style.display = "none";
}

function startExperience(){
document.getElementById("intro").style.display="none";
}

function animate(){
requestAnimationFrame(animate);
controls.update();
renderer.render(scene,camera);
}
animate();
</script>

</body>
  <script type="module">

import * as THREE from 'https://unpkg.com/three@0.155.0/build/three.module.js';
import { OrbitControls } from 'https://unpkg.com/three@0.155.0/examples/jsm/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0f2c);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 20;

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;

const textureLoader = new THREE.TextureLoader();
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const planets = [];

for(let i=0;i<8;i++){
    const geometry = new THREE.SphereGeometry(2,32,32);
    const material = new THREE.MeshBasicMaterial({
        map: textureLoader.load(`p${i+1}.jpg`)
    });

    const planet = new THREE.Mesh(geometry, material);
    planet.position.x = Math.cos(i * Math.PI/4) * 12;
    planet.position.y = Math.sin(i * Math.PI/4) * 6;

    scene.add(planet);
    planets.push(planet);
}

window.addEventListener('click', (event)=>{
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = - (event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(planets);

    if(intersects.length > 0){
        alert("Planeta tocado 💙");
    }
});

function animate(){
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene,camera);
}
animate();

</script>

</html>
